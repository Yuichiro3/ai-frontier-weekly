# Target source list for the weekly collectors.
# The Orchestrator reads this file to decide which targets to dispatch to
# which collector agent each week. Edit this file (via PR) to adjust
# coverage — e.g. split "OpenAI" into a named-leader target for a week with
# a major announcement, or add a new institution.

evaluators_and_institutes:
  - name: METR
    url: https://metr.org
  - name: UK AI Security Institute
    url: https://www.aisi.gov.uk
  - name: Epoch AI
    url: https://epochai.org

industry_leaders:
  # Each entry can be a company (broad) or "Person / Company" (narrow).
  # The Orchestrator may split a company into named-leader targets for weeks
  # with unusually high news volume — this list is the default granularity.
  - name: OpenAI
    url: https://openai.com/news
  - name: Anthropic
    url: https://www.anthropic.com/news
  - name: Google DeepMind
    url: https://deepmind.google/discover/blog
  - name: Meta AI
    url: https://ai.meta.com/blog
  - name: Microsoft
    url: https://blogs.microsoft.com/ai
  - name: Sakana AI
    url: https://sakana.ai/blog

academic_institutions:
  - name: MIT CSAIL
    url: https://www.csail.mit.edu/news
  - name: Stanford HAI
    url: https://hai.stanford.edu/news
  - name: Carnegie Mellon University - Robotics Institute
    url: https://www.ri.cmu.edu/category/news
  - name: The Alan Turing Institute
    url: https://www.turing.ac.uk/news
  - name: University of Tokyo / RIKEN AIP
    url: https://aip.riken.jp/news/

wildcard:
  # No fixed target list — the wildcard-collector scans broadly each week.
  notes: "Scan Hacker News top posts, independent researcher blogs, and open-source AI project updates for one or two credible, interesting items."

# --- Rotation / diversity history -------------------------------------
# The Orchestrator (or a human) appends a short note here after each run
# so future runs can check they aren't over-relying on the same sources.
rotation_history:
  - run_date: "2026-08-13"
    iso_week: "2026-W33"
    note: >
      First tracked run. Covered the full default target list (3 evaluators,
      6 industry leaders, 5 academic institutions, wildcard) with no rotation
      applied. UTokyo/RIKEN AIP returned zero items this week (network access
      to aip.riken.jp and u-tokyo.ac.jp was blocked in the collection
      environment, not confirmed absence of news) -- worth prioritizing a
      retry next week rather than treating it as "nothing published" twice
      running. Evaluator coverage was thin overall (METR, Epoch AI, CMU RI,
      and Turing each returned only one item or a database refresh); no
      rotation action needed yet since this is the baseline week, but future
      runs should watch for repeated thin evaluator coverage.
  - run_date: "2026-08-29"
    iso_week: "2026-W35"
    note: >
      No run was produced for 2026-W34 (2026-08-20); this run picked back up
      with the full default target list. UTokyo/RIKEN AIP access to
      aip.riken.jp was retried directly as flagged last time and is STILL
      blocked in this collection environment -- this is now confirmed as an
      environment-wide egress restriction (every WebFetch domain was blocked
      this run, including unrelated control domains), not a target-specific
      problem, so it should stop being treated as evaluator-coverage rotation
      noise and instead be raised with whoever operates the harness. Because
      almost every collector's direct WebFetch was blocked this run, most
      items across all categories were reconstructed from WebSearch snippets
      and cross-checked against independent reporting rather than read
      directly from the source; this is flagged per-item via a "confidence"
      field and should improve once direct fetch access is restored.
      Diversity flag: OpenAI and Anthropic together account for 15 of 38
      cited items (~40%) in this week's report, versus roughly even coverage
      last run. This reflects real news volume (both labs disclosed the same
      Hugging Face agent-containment incident this fortnight) rather than a
      collection-scope bias -- every target on the list was still collected
      once -- but it is a real concentration and future runs should watch
      whether it persists once a third data point is available. Evaluator
      coverage remains a standing thinness pattern: METR, Epoch AI, and AISI
      again returned mostly pre-window items (their most recent original
      publications were dated 2026-08-04 to 2026-08-14, before this run's
      ~2026-08-15 to 2026-08-29 window), which should be re-checked once
      access constraints are resolved rather than assumed to mean no new
      evaluator output existed.
